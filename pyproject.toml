[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "alteron"
version = "1.0.0"
description = "Behavioral regression testing for NLP classifiers using metamorphic testing."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.0.0",
    "transformers>=4.35.0",
    "accelerate>=1.1.0",
    "datasets>=2.14.0",
    "spacy>=3.6.0",
    "nltk>=3.8.0",
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "pyyaml>=6.0",
]

[project.scripts]
alteron = "alteron.cli:main"
alteron-ci = "alteron.ci.runner:main"

[dependency-groups]
dev = [
    "pytest>=7.4.0",
]

[tool.setuptools.packages.find]
include = ["alteron*"]

[tool.setuptools.package-data]
alteron = ["registry/mr_registry.yaml", "ci/github_actions_template.yml", "ci/profiles.yml"]
